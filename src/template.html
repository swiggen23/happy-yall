      '</div><aside class="side">' + directionsBlock(v) + nearbyBlock(v) + '</aside>';
  }

  function directionsBlock(v) {
    return '<section class="empty"><h2>Get there</h2>' +
      (S.start ? '<p><strong>' + esc(travelText(travel(S.start, v))) + '</strong> from ' + esc(S.start.label) + ' (estimate).</p>' : '<p>Add a starting point to see walk time and a route line.</p>') +
      '<div class="grid2"><a class="cta" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + gmaps(S.start, v) + '" target="_blank" rel="noopener">Google Maps</a>' +
      '<a class="ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)" href="' + amaps(S.start, v) + '" target="_blank" rel="noopener">Apple Maps</a></div>' +
      '<button type="button" class="ghost" data-go="map" data-mode="pick" data-focus="' + v.id + '">See route on map</button>' +
      (S.start ? '' : startForm()) + '</section>';
  }
  function nearbyBlock(v) {
    const r = results();
    const near = r.matches.concat(r.close).filter((e) => e.v.id !== v.id).map((e) => ({ e: e, tr: travel(v, e.v) })).sort((a, b) => a.tr.walk - b.tr.walk).slice(0, 4);
    if (!near.length) return '';
    return '<section><h2 style="margin-bottom:10px">Nearby matches</h2><ul class="list">' + near.map((n) =>
      '<li><button type="button" class="row" data-venue="' + n.e.v.id + '"><span class="n">' + esc(n.e.v.name) + '</span><span class="p">' + (n.e.cheap != null ? money(n.e.cheap) : '?') + '</span>' +
      '<span class="s">' + esc(travelText(n.tr)) + (n.e.bucket === 'close' ? ' · close: ' + esc(n.e.misses[0]) : '') + '</span><span class="s">' + n.e.score + '/100</span></button></li>').join('') + '</ul></section>';
  }

  function viewMap(embed) {
    const r = results(), t = target();
    const status = {}; r.matches.forEach((e, i) => { status[e.v.id] = { k: 'match', rank: i + 1 }; }); r.close.forEach((e) => { status[e.v.id] = { k: 'close' }; });
    const pool = VENUES.filter(inArea);
    const focus = (!embed && VENUES.find((v) => v.id === S.focus)) || (r.matches[0] && r.matches[0].v) || null;
    const hop = !embed && S.mapMode === 'hop' ? hopPlan(r.matches) : null;
    const pts = pool.map((v) => [v.lat, v.lng]); if (S.start) pts.push([S.start.lat, S.start.lng]);
    let minLat = Math.min(...pts.map((p) => p[0])), maxLat = Math.max(...pts.map((p) => p[0])), minLng = Math.min(...pts.map((p) => p[1])), maxLng = Math.max(...pts.map((p) => p[1]));
    const padLat = Math.max((maxLat - minLat) * 0.14, 0.003), padLng = Math.max((maxLng - minLng) * 0.14, 0.003);
    minLat -= padLat; maxLat += padLat; minLng -= padLng; maxLng += padLng;
    const W = 400, H = 460, sx = Math.cos(30.25 * Math.PI / 180);
    const spanX = (maxLng - minLng) * sx, spanY = maxLat - minLat, k = Math.min(W / spanX, H / spanY);
    const ox = (W - spanX * k) / 2, oy = (H - spanY * k) / 2;
    const X = (lng) => ox + (lng - minLng) * sx * k, Y = (lat) => oy + (maxLat - lat) * k;
    const P = (lat, lng) => X(lng).toFixed(1) + ',' + Y(lat).toFixed(1);
    const poly = (arr) => arr.map((p) => P(p[0], p[1])).join(' ');
    const font = 'font-family="DM Sans, sans-serif"';
    // Base layer: park, river, highways, main streets, minor streets, labels.
    let base = '<polygon points="' + poly(PARK) + '" fill="#8FE3CF" fill-opacity="0.45"/>';
    const style = { water: ['#9FD3E6', 12], highway: ['#F3C3A8', 7], main: ['#FFFFFF', 6], minor: ['#FFFFFF', 3.5] };
    ['water', 'highway', 'main', 'minor'].forEach((kind) => LINES.filter((l) => l.kind === kind).forEach((l) => {
      if (kind === 'main') base += '<polyline points="' + poly(l.pts) + '" fill="none" stroke="#E6D5C3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>';
      base += '<polyline points="' + poly(l.pts) + '" fill="none" stroke="' + style[kind][0] + '" stroke-width="' + style[kind][1] + '" stroke-linecap="round" stroke-linejoin="round"/>';
    }));
    LINES.forEach((l) => { const m = l.pts[Math.floor(l.pts.length / 2)]; const x = X(m[1]), y = Y(m[0]); if (x < 10 || x > W - 10 || y < 14 || y > H - 6) return; base += '<text x="' + (x + 6).toFixed(1) + '" y="' + (y - 6).toFixed(1) + '" ' + font + ' font-size="10.5" font-weight="700" fill="' + (l.kind === 'water' ? '#2F6E86' : '#6B5E55') + '" paint-order="stroke" stroke="#FFF4E8" stroke-width="3">' + esc(l.name) + '</text>'; });
    const pz = PARK[0]; base += '<text x="' + (X(-97.7735) - 22).toFixed(1) + '" y="' + Y(30.2672).toFixed(1) + '" ' + font + ' font-size="10.5" font-weight="700" fill="#24735F">Zilker Park</text>';
    // Overlay: proximity lines (pick mode) or bar-hop path, plus start-to-pick route.
    let over = '';
    let near = [];
    if (!hop && focus) {
      near = r.matches.concat(r.close).filter((e) => e.v.id !== focus.id).map((e) => ({ e: e, tr: travel(focus, e.v) })).sort((a, b) => a.tr.walk - b.tr.walk).slice(0, 3);
      near.forEach((n) => { over += '<line x1="' + X(focus.lng).toFixed(1) + '" y1="' + Y(focus.lat).toFixed(1) + '" x2="' + X(n.e.v.lng).toFixed(1) + '" y2="' + Y(n.e.v.lat).toFixed(1) + '" stroke="#1A1440" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>'; });
      if (S.start) { const tr = travel(S.start, focus); over += '<line x1="' + X(S.start.lng).toFixed(1) + '" y1="' + Y(S.start.lat).toFixed(1) + '" x2="' + X(focus.lng).toFixed(1) + '" y2="' + Y(focus.lat).toFixed(1) + '" stroke="#1B2F9E" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/>' + '<text x="' + ((X(S.start.lng) + X(focus.lng)) / 2 + 8).toFixed(1) + '" y="' + ((Y(S.start.lat) + Y(focus.lat)) / 2).toFixed(1) + '" ' + font + ' font-size="12" font-weight="700" fill="#1B2F9E" paint-order="stroke" stroke="#FFF4E8" stroke-width="4">' + tr.walk + ' min</text>'; }
    }
    const hopIndex = {};
    if (hop) {
      const path = (S.start ? [[S.start.lat, S.start.lng]] : []).concat(hop.legs.map((l) => [l.v.lat, l.v.lng]));
      over += '<polyline points="' + poly(path) + '" fill="none" stroke="#1B2F9E" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round" stroke-linejoin="round"/>';
      hop.legs.forEach((l, i) => { hopIndex[l.v.id] = i + 1; });
    }
    const order = pool.slice().sort((a, b) => (status[a.id] ? (status[a.id].k === 'match' ? 2 : 1) : 0) - (status[b.id] ? (status[b.id].k === 'match' ? 2 : 1) : 0) + ((a === focus) - (b === focus)) * 3);
    let pins = '';
    order.forEach((v) => {
      const st = status[v.id], x = X(v.lng).toFixed(1), y = Y(v.lat).toFixed(1);
      const fill = st ? (st.k === 'match' ? (st.rank === 1 ? '#E2482A' : '#FFD23F') : '#8FE3CF') : '#FFFFFF';
      const isFocus = !hop && focus && v.id === focus.id;
      const r0 = st && st.k === 'match' ? (st.rank === 1 ? 15 : 12) : 8;
      const lab = hop ? (hopIndex[v.id] || '') : (st && st.k === 'match' ? st.rank : '');
      pins += '<g class="pin" data-venue="' + v.id + '" role="button" tabindex="0" aria-label="' + esc(v.name) + '" style="cursor:pointer">' +
        (isFocus || hopIndex[v.id] ? '<circle cx="' + x + '" cy="' + y + '" r="' + (r0 + 6) + '" fill="none" stroke="#1B2F9E" stroke-width="3"/>' : '') +
        '<circle cx="' + x + '" cy="' + y + '" r="' + r0 + '" fill="' + fill + '" stroke="#1A1440" stroke-width="2.5"/>' +
        (lab !== '' ? '<text x="' + x + '" y="' + (+y + 4.5) + '" text-anchor="middle" ' + font + ' font-size="12" font-weight="700" fill="' + (st && st.rank === 1 && !hop ? '#FFFFFF' : '#1A1440') + '">' + lab + '</text>' : '') + '</g>';
    });
    if (focus && !hop) { const fx = X(focus.lng), left = fx > W * 0.62; pins += '<text x="' + (left ? fx - 22 : fx + 22).toFixed(1) + '" y="' + (Y(focus.lat) + 4).toFixed(1) + '" text-anchor="' + (left ? 'end' : 'start') + '" ' + font + ' font-size="12.5" font-weight="700" fill="#1A1440" paint-order="stroke" stroke="#FFF4E8" stroke-width="4">' + esc(focus.name) + '</text>'; }
    if (S.start) { const x = X(S.start.lng), y = Y(S.start.lat); pins += '<rect x="' + (x - 9).toFixed(1) + '" y="' + (y - 9).toFixed(1) + '" width="18" height="18" rx="4" fill="#1B2F9E" stroke="#FFFFFF" stroke-width="2.5"/><text x="' + (x + 14).toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" ' + font + ' font-size="12" font-weight="700" fill="#1B2F9E" paint-order="stroke" stroke="#FFF4E8" stroke-width="4">Start</text>'; }

    let panel = '';
    if (hop) {
      const legs = hop.legs;
      const origin = S.start || legs[0].v, dest = legs[legs.length - 1].v;
      const mids = (S.start ? legs.slice(0, -1) : legs.slice(1, -1)).map((l) => l.v);
      panel = '<section class="empty"><h2>Your bar hop</h2><p>' + legs.length + ' stops, about 45 min each' + (hop.totalWalk ? ', ' + hop.totalWalk + ' min of walking' : '') + '. Starts ' + (S.when === 'now' ? 'now' : clock(t.min)) + '.</p>' +
        '<ol class="list" style="list-style:none">' + legs.map((l, i) => '<li><button type="button" class="row" data-venue="' + l.v.id + '"><span class="n">' + (i + 1) + '. ' + esc(l.v.name) + '</span><span class="p">' + (cheapFor(l.v, t.day) != null ? money(cheapFor(l.v, t.day)) : '?') + '</span>' +
          '<span class="s">' + (l.tr ? esc(travelText(l.tr)) + ' · ' : '') + 'arrive ~' + clock(l.arrive) + '</span>' +
          '<span class="' + (l.late ? 'why' : 's') + '">' + (l.late ? 'HH over by then' : 'HH until ' + clock(l.end)) + '</span></button></li>').join('') + '</ol>' +
        '<a class="cta" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + gmaps(origin, dest, mids) + '" target="_blank" rel="noopener">Open whole route in Google Maps</a>' +
        (legs.length < 2 ? '<p class="note">No other match within a 20 min walk is still pouring after ' + esc(legs[0].v.name) + '. Try an earlier time or All 4 neighborhoods.</p>' : '') + '<p class="foot">Each next stop is the closest match within a 20 min walk that\'s still pouring when you arrive. About 45 min per stop. Times are estimates.</p></section>';
    } else if (focus) {
      const fe = evaluate(focus);
      panel = '<button type="button" class="card" data-venue="' + focus.id + '"><span class="badge">' + (fe.bucket === 'match' ? 'Match · ' + fe.score + '/100' : esc(focus.hood)) + '</span><h3>' + esc(focus.name) + '</h3>' + (fe.why ? '<p>' + esc(fe.why.join(', ')) + '</p>' : '') + (S.start ? '<p class="score">' + esc(fromStart(focus)) + '</p>' : '') + '</button>' +
        '<div class="grid2"><a class="cta" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + gmaps(S.start, focus) + '" target="_blank" rel="noopener">Google Maps</a><a class="ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)" href="' + amaps(S.start, focus) + '" target="_blank" rel="noopener">Apple Maps</a></div>' +
        (near.length ? '<section><h2 style="margin-bottom:10px">Closest other matches</h2><ul class="list">' + near.map((n) => '<li><button type="button" class="row" data-focus="' + n.e.v.id + '"><span class="n">' + esc(n.e.v.name) + '</span><span class="p">' + (n.e.cheap != null ? money(n.e.cheap) : '?') + '</span><span class="s">' + esc(travelText(n.tr)) + ' from ' + esc(focus.name) + '</span><span class="s">' + (n.e.bucket === 'close' ? 'close match' : n.e.score + '/100') + '</span></button></li>').join('') + '</ul></section>' : '');
    }
    let mapBox = '<div class="mapbox"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Map of happy hours with main streets">' + '<rect width="' + W + '" height="' + H + '" fill="#FFF4E8"/>' + base + over + pins + '</svg></div>';
    if (USE_LEAFLET) {
      const id = 'leaf-' + (embed ? 'e' : 'm');
      PENDING.push({ id: id, pool: pool, status: status, focus: hop ? null : focus, near: near, hop: hop, hopIndex: hopIndex });
      mapBox = '<div class="mapbox"><div class="leaf' + (embed ? ' leaf-e' : '') + '" id="' + id + '" role="region" aria-label="Street map of happy hours"></div></div>';
    }
    const mapHtml = mapBox +
      '<div class="legend"><span><span class="dot" style="background:#E2482A"></span>#1 match</span><span><span class="dot" style="background:#FFD23F"></span>Matches</span><span><span class="dot" style="background:#8FE3CF"></span>Close</span><span><span class="dot" style="background:#FFFFFF"></span>Not now</span>' + (S.start ? '<span><span class="dot" style="background:#1B2F9E;border-radius:4px"></span>Start</span>' : '') + '</div>';
    if (embed) return mapHtml;
    return '<div class="main">' + backHeader('Back', '<span class="step">' + pool.length + ' spots</span>') +
      '<div class="grid2" role="group" aria-label="Map mode"><button type="button" class="seg" data-mode="pick"' + pressed(!hop) + '>Route to a pick</button><button type="button" class="seg" data-mode="hop"' + pressed(!!hop) + (r.matches.length < 2 ? ' disabled' : '') + '>Bar hop</button></div>' +
      mapHtml +
      '<p class="foot">Tap a pin to center on it. Walk times are estimates; tap Google or Apple Maps for exact directions.</p>' +
      '</div><aside class="side">' + startForm() + panel + '</aside>';
  }

  function render() {
    const views = { start: viewStart, vibe: viewVibe, results: viewResults, detail: viewDetail, map: viewMap };
    MAPS.forEach((m) => m.remove()); MAPS.length = 0; PENDING.length = 0;
    const html = views[S.screen]();
    app.className = 'app s-' + S.screen;
    app.innerHTML = html.indexOf('class="main"') >= 0 ? html : '<div class="main">' + html + '</div>';
    if (USE_LEAFLET) PENDING.forEach(mountMap);
  }

  // Real street map (live site only): CARTO Voyager tiles over OpenStreetMap data, same pin colors as the drawn map.
  function pinIcon(fill, d, label, ring, light) {
    return L.divIcon({ className: 'lpin-wrap', iconSize: [d, d], iconAnchor: [d / 2, d / 2],
      html: '<span class="lpin' + (ring ? ' ring' : '') + '" style="width:' + d + 'px;height:' + d + 'px;background:' + fill + ';color:' + (light ? '#FFFFFF' : '#1A1440') + '">' + label + '</span>' });
  }
  function handlePin(id) { if (S.screen === 'map') { S.focus = id; S.mapMode = 'pick'; render(); } else go('detail', { venue: id }); }
  function mountMap(spec) {
    const el = document.getElementById(spec.id);
    if (!el || el.offsetParent === null) return;
    const m = L.map(el, { scrollWheelZoom: false, tap: true });
    MAPS.push(m);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>' }).addTo(m);
    const ll = (p) => [p.lat, p.lng];
    if (spec.focus) spec.near.forEach((n) => L.polyline([ll(spec.focus), ll(n.e.v)], { color: '#1A1440', weight: 2, dashArray: '2 7', interactive: false }).addTo(m));
    if (spec.focus && S.start) {
      const tr = travel(S.start, spec.focus);
      L.polyline([ll(S.start), ll(spec.focus)], { color: '#1B2F9E', weight: 4, dashArray: '10 8', interactive: false }).addTo(m)
        .bindTooltip(tr.walk + ' min walk', { permanent: true, direction: 'center', className: 'ltip ltip-route' });
    }
    if (spec.hop) L.polyline((S.start ? [ll(S.start)] : []).concat(spec.hop.legs.map((l) => ll(l.v))), { color: '#1B2F9E', weight: 4, dashArray: '10 8', interactive: false }).addTo(m);
    const rankOf = (v) => (spec.status[v.id] ? (spec.status[v.id].k === 'match' ? 2 : 1) : 0);
    spec.pool.slice().sort((a, b) => rankOf(a) - rankOf(b)).forEach((v) => {
      const st = spec.status[v.id];
      const isMatch = st && st.k === 'match', first = isMatch && st.rank === 1;
      const fill = st ? (isMatch ? (first ? '#E2482A' : '#FFD23F') : '#8FE3CF') : '#FFFFFF';
      const d = isMatch ? (first ? 34 : 28) : 18;
      const label = spec.hop ? (spec.hopIndex[v.id] || '') : (isMatch ? st.rank : '');
      const ring = (spec.focus && spec.focus.id === v.id) || !!spec.hopIndex[v.id];
      const mk = L.marker(ll(v), { icon: pinIcon(fill, d, label, ring, first && !spec.hop), zIndexOffset: rankOf(v) * 100 + (ring ? 500 : 0), title: v.name, keyboard: true }).addTo(m);
      mk.on('click', () => handlePin(v.id));
      if (spec.focus && spec.focus.id === v.id) mk.bindTooltip(v.name, { permanent: true, direction: 'right', offset: [d / 2 + 4, 0], className: 'ltip' });
      else mk.bindTooltip(v.name + (st && isMatch ? ' · #' + st.rank : ''), { direction: 'top', offset: [0, -d / 2], className: 'ltip' });
    });
    if (S.start) L.marker(ll(S.start), { icon: L.divIcon({ className: 'lpin-wrap', iconSize: [20, 20], iconAnchor: [10, 10], html: '<span class="lstart"></span>' }), zIndexOffset: 1000, title: 'Start' }).addTo(m).bindTooltip('Start', { permanent: true, direction: 'left', offset: [-12, 0], className: 'ltip ltip-route' });
    const pts = spec.pool.map(ll); if (S.start) pts.push(ll(S.start));
    m.fitBounds(L.latLngBounds(pts), { padding: [36, 36], maxZoom: 16 });
  }

  app.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act],[data-go],[data-mode],[data-focus],[data-hood],[data-when],[data-vibe],[data-price],[data-group],[data-venue]');
    if (!el) return;
    const d = el.dataset;
    if (d.act === 'back') return back();
    if (d.act === 'home') { S.prev = []; S.screen = 'start'; return render(); }
    if (d.act === 'pick5') { S.when = 'pick'; S.day = NOW.day; S.min = 1020; save(); return render(); }
    if (d.act === 'clearstart') { S.start = null; S.startError = null; save(); return render(); }
    if (d.act === 'locate') {
      S.locating = true; S.startError = null; render();
      navigator.geolocation.getCurrentPosition((pos) => { S.locating = false; S.start = { label: 'My location', lat: pos.coords.latitude, lng: pos.coords.longitude }; save(); render(); },
        () => { S.locating = false; S.startError = 'Couldn\'t get your location. Allow location access, or type an address.'; render(); }, { timeout: 10000, maximumAge: 60000 });
      return;
    }
    if (d.mode) S.mapMode = d.mode;
    if (d.focus && S.screen === 'map' && !d.go) { S.focus = d.focus; S.mapMode = 'pick'; return render(); }
    if (d.focus) S.focus = d.focus;
    if (d.go) { if (d.go === 'map' && !d.focus && !d.mode) S.focus = null; return go(d.go); }
    if (d.venue && S.screen === 'map' && ev.target.closest('.pin')) { S.focus = d.venue; S.mapMode = 'pick'; return render(); }
    if (d.venue) return go('detail', { venue: d.venue });
    if (d.mode) { save(); return render(); }
    if (d.hood) {
      if (d.hood === 'all') S.hoods = HOODS.slice();
      else if (S.hoods.indexOf(d.hood) >= 0) { if (S.hoods.length > 1) S.hoods = S.hoods.filter((h) => h !== d.hood); }
      else S.hoods = HOODS.filter((h) => h === d.hood || S.hoods.indexOf(h) >= 0);
    }
    if (d.when) S.when = d.when;
    if (d.vibe) S.vibes[d.vibe] = !S.vibes[d.vibe];
    if (d.price) S.price = d.price === 'any' ? null : Number(d.price);
    if (d.group) S.group = d.group;
    save(); render();
  });
  app.addEventListener('submit', (ev) => {
    if (ev.target.id !== 'startform') return; ev.preventDefault();
    const q = document.getElementById('startq').value;
    const res = geocode(q);
    if (res && res.error && USE_LEAFLET) { searchOnline(q); return; }
    if (!res) { S.start = null; S.startError = null; } else if (res.error) { S.startError = res.error; } else { S.start = res; S.startError = null; }
    save(); render();
  });
  // Live site: fall back to OpenStreetMap address search, limited to central Austin.
  function searchOnline(q) {
    S.startError = 'Searching…'; render();
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&bounded=1&viewbox=-97.86,30.34,-97.66,30.17&q=' + encodeURIComponent(q + ', Austin, TX'), { headers: { 'Accept-Language': 'en' } })
      .then((r) => r.json())
      .then((rows) => {
        if (rows && rows.length) { S.start = { label: rows[0].display_name.split(',').slice(0, 2).join(',').trim(), lat: +rows[0].lat, lng: +rows[0].lon }; S.startError = null; }
        else S.startError = 'Couldn\'t find "' + q + '" in central Austin. Try a street address, cross streets, or a landmark.';
        save(); render();
      })
      .catch(() => { S.startError = 'Address search is unavailable right now. Try a landmark or cross streets.'; render(); });
  }
  app.addEventListener('keydown', (ev) => { const p = ev.target.closest('.pin'); if (p && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); S.focus = p.dataset.venue; S.mapMode = 'pick'; render(); } });
  app.addEventListener('change', (ev) => {
    if (ev.target.id !== 'day' && ev.target.id !== 'time') return;
    if (ev.target.id === 'day') S.day = Number(ev.target.value);
    if (ev.target.id === 'time') S.min = Number(ev.target.value);
    save(); render();
  });
  render();
})();
</script>
